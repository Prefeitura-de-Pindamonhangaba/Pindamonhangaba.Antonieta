name: Backend tests

on:
  pull_request:
    paths:
      - 'Antonieta.Backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [main]
    paths:
      - 'Antonieta.Backend/**'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: antonieta_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d antonieta_tests"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: Antonieta.Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Antonieta.Backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -p postgres_concurrency.py -v
        env:
          POSTGRES_TEST_URL: postgresql://test_user:test_password@localhost:5432/antonieta_tests
